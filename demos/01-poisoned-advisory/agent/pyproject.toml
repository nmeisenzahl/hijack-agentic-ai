[project]
name = "demo01-poisoned-advisory-agent"
version = "0.1.0"
description = "Demo 01: Poisoned Advisory – Indirect Prompt Injection via local security advisories"
requires-python = ">=3.12"
dependencies = [
    "flock-core==0.5.600",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "rich==14.2.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "model_config.py", "loader.py", "models.py", "tools.py", "security"]
