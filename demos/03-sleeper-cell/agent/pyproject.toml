[project]
name = "demo03-sleeper-cell-agent"
version = "0.1.0"
description = "Demo 03: Sleeper Cell Agent - RAG exfiltration via generated code"
requires-python = ">=3.12"
dependencies = [
    "flock-core==0.5.600",
    "agent-governance-toolkit-core==5.0.0",
    "chromadb==1.5.9",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",  # agent-governance-toolkit-core imports yaml when its modules load.
    "rich==14.2.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = [
    "embedding.py",
    "main.py",
    "model_config.py",
    "models.py",
    "tools.py",
    "security",
]
