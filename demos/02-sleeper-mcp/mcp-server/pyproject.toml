[project]
name = "demo02-sleeper-mcp-server"
version = "0.1.0"
description = "Demo 02: Sleeper MCP Server — workforce-planning overcollection via tool description mutation"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    "starlette==1.6.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "uvicorn[standard]==0.52.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
